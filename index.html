<!-- Vendored (no CDN dependency at runtime) -->
<!-- Apply theme before first paint to avoid a flash of the wrong palette -->
<script>
  (function () {
    try {
      var p = localStorage.getItem('ists.theme') || 'dark';
      var r = p === 'system'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : p;
      document.documentElement.setAttribute('data-theme', r);
      var pr = JSON.parse(localStorage.getItem('ists.prefs') || '{}');
      document.documentElement.setAttribute('data-density', pr.density || 'comfortable');
      document.documentElement.setAttribute('data-motion', pr.motion || 'full');
    } catch (e) {}
  })();
</script>
